[package]
name = "wmpass-net"
description = "Opt-in network features for WM Pass: aliases, breach checks, username probes. Every request passes one policy."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# A blocking client for desktop, CLI and JNI. The extension supplies fetch instead.
native = ["dep:ureq", "dep:rustls", "dep:sha2"]

[dependencies]
wmpass-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha1.workspace = true
zeroize.workspace = true
url = "2.5.8"
# The pinned client builds on ureq's `unversioned` transport API, which may change in a minor release.
ureq = { version = "~3.5", optional = true }
# The same rustls ureq uses, for the pinned client's own certificate check.
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "tls12", "ring"] }
sha2 = { workspace = true, optional = true }
