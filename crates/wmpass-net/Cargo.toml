[package]
name = "wmpass-net"
description = "Opt-in network features for WM Pass: aliases, breach checks, username probes. Every request passes one policy."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# A blocking client for desktop, CLI and JNI. The extension supplies fetch instead.
native = ["dep:ureq"]

[dependencies]
wmpass-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha1.workspace = true
zeroize.workspace = true
url = "2.5.8"
ureq = { version = "3", optional = true }
