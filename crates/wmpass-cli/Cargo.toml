[package]
name = "wmpass-cli"
description = "Command line client for WM Pass vaults."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "wmpass"
path = "src/main.rs"

[features]
default = ["tui"]
# The full-screen app, run as `wmpass` with no subcommand or `wmpass tui`. A build for
# scripts only can leave it out with --no-default-features.
tui = ["dep:wmpass-tui"]

[dependencies]
wmpass-core.workspace = true
wmpass-tui = { path = "../wmpass-tui", optional = true }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
serde_json.workspace = true
getrandom.workspace = true

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
