[package]
name = "wmpass-session"
description = "The one interface every WM Pass shell uses. Vault state stays here behind a handle; views carry no secrets."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Network features, for shells with a blocking HTTP client. The extension has none.
net = ["dep:wmpass-net", "wmpass-net/native"]

[dependencies]
wmpass-core.workspace = true
wmpass-net = { path = "../wmpass-net", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
base64 = "0.23.1"
