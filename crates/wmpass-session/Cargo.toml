[package]
name = "wmpass-session"
description = "The one interface every WM Pass shell uses. Vault state stays here behind a handle; views carry no secrets."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Network features, for shells with a blocking HTTP client. The extension has none.
net = ["dep:wmpass-net", "wmpass-net/native", "dep:wmpass-bw", "dep:wmpass-lan"]

[dependencies]
wmpass-core.workspace = true
wmpass-net = { path = "../wmpass-net", optional = true }
wmpass-bw = { path = "../wmpass-bw", optional = true }
wmpass-lan = { path = "../wmpass-lan", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
base64 = "0.23.1"
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.11", default-features = false }
