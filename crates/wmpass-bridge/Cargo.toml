[package]
name = "wmpass-bridge"
description = "The encrypted conversation between the WM Pass browser extension and desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
blake3 = "1.8"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
subtle = "2.6"
thiserror = "2"
x25519-dalek = { version = "3", features = ["static_secrets"] }
zeroize = "1.9"

[dev-dependencies]
base64 = "0.23.1"
