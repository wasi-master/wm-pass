[package]
name = "wmpass-sinks"
description = "Where encrypted vault files can live: WebDAV, S3, cloud drives, folders, and the sync and backup routines over them."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
native = ["wmpass-net/native"]

[dependencies]
wmpass-core.workspace = true
wmpass-net = { path = "../wmpass-net" }
serde_json.workspace = true
sha2.workspace = true
hmac.workspace = true
quick-xml = "0.42.0"
base64 = "0.23.1"
getrandom.workspace = true
url = "2.5.8"
# MEGA: AES for its node keys, PBKDF2 for v2 accounts, RSA (by hand) for the session id.
aes = "0.9"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
num-bigint = { version = "0.5", default-features = false, features = ["std"] }
subtle = "2.6"
# Proton Drive's OpenPGP and SRP, and iCloud's SRP, by hand over these.
sha1.workspace = true
x25519-dalek.workspace = true
ed25519-dalek = "3"
blowfish = { version = "0.10", features = ["bcrypt"] }
miniz_oxide = "0.9"
unicode-normalization = "0.1"

# Native only, like the sinks that need them (raw sockets).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# SMB: NTLM's digests, SMB 3 signing and encryption.
md4 = "0.11"
md-5 = "0.11"
cmac = "0.8"
ccm = "0.6"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
# SSH (for SFTP) and NFS, hand-written over these primitives.
ctr = "0.10"
chacha20 = { version = "0.10", features = ["legacy"] }
poly1305 = "0.9"
bcrypt-pbkdf = "0.11"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
zeroize.workspace = true
# TLS for FTPS and IMAP: the same rustls ureq already brings in.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
