[package]
name = "wmpass-wasm"
description = "The WM Pass session for the browser extension and the web vault, built for WebAssembly."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
wmpass-session = { path = "../wmpass-session", features = ["online"] }
wmpass-bridge = { path = "../wmpass-bridge" }
serde_json = "1"
zeroize.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wmpass-net = { path = "../wmpass-net" }
wmpass-sinks = { path = "../wmpass-sinks" }

# Each generation of getrandom in the tree has to be told to ask the browser for randomness.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
