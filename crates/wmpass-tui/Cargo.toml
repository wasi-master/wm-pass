[package]
name = "wmpass-tui"
description = "The terminal app for WM Pass vaults: a full-screen interface over the same session every shell uses."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
wmpass-core.workspace = true
wmpass-session = { path = "../wmpass-session" }
wmpass-lan = { path = "../wmpass-lan" }
qrcode = { version = "0.14", default-features = false }
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
blake3.workspace = true
getrandom.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
base64 = "0.23.1"

[dev-dependencies]
tempfile = "3"
