[package]
name = "wmpass-host"
description = "Carries the extension's sealed frames between the browser and the WM Pass app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "wm-pass-host"
path = "src/main.rs"

[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
base64 = "0.23.1"
interprocess = "2.4"
serde_json = "1"
