Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: android-v0.1.0
    subdir: android/app
    submodules: true
    gradle:
      - yes
    gradleprops:
      - wmpass.fdroid=true
    ndk: r27c
    srclibs:
      - rustup@stable
    prebuild: ../../../srclibs/rustup/rustup-init.sh -y --default-toolchain 1.99.1
    build: cargo install cargo-ndk --locked

