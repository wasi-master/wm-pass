name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libpcsclite-dev
      # The desktop shell needs WebKitGTK and a page build; the desktop job tests it.
      - run: cargo test --workspace --exclude wmpass-desktop
      - run: cargo clippy --workspace --exclude wmpass-desktop --all-targets --all-features -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p wmpass-tui -p wmpass-cli
      - run: cargo clippy -p wmpass-tui -p wmpass-cli --all-targets -- -D warnings

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev libpcsclite-dev libxdo-dev
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run desktop:build
      - run: cargo clippy -p wmpass-desktop --all-targets -- -D warnings
      - run: cargo test -p wmpass-desktop -p wmpass-host -p wmpass-bridge

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci
      - run: npm run extension:build
      - run: npm run extension:lint
      - run: npm run check
      # The phone's help.json and the docs' Guide pages are written from help/ and committed.
      - run: npm run help && test -z "$(git status --porcelain data/help docs/src/content/docs/guide)"
      - run: npx playwright install --with-deps chromium
      # The web vault, built first so the extension's test can check the hand-over from it.
      - run: npm run web:build
      - run: xvfb-run -a node web/test/run.mjs
      - run: xvfb-run -a node extension/test/run.mjs

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # WM Suite (android/vendor/wm-suite) is a private repository this workflow's own token
      # cannot read. It comes in with a read-only deploy key of its own, at the submodule's commit.
      - id: suite
        env:
          KEY: ${{ secrets.WM_SUITE_DEPLOY_KEY }}
        run: |
          test -n "$KEY" || { echo "::error::Add a WM_SUITE_DEPLOY_KEY secret: the private half of a read-only deploy key of wasi-master/wm-suite"; exit 1; }
          echo "commit=$(git rev-parse HEAD:android/vendor/wm-suite)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: wasi-master/wm-suite
          ref: ${{ steps.suite.outputs.commit }}
          path: android/vendor/wm-suite
          ssh-key: ${{ secrets.WM_SUITE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: rustup target add aarch64-linux-android x86_64-linux-android armv7-linux-androideabi
      - run: cargo install cargo-ndk --locked
      - run: ./gradlew :app:assembleDebug :wear:assembleDebug :app:testDebugUnitTest
        working-directory: android

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install && npm run build
        working-directory: docs
