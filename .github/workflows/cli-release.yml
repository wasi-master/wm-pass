name: Command line release

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { key: '${{ matrix.target }}' }
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p wmpass-cli --target ${{ matrix.target }}
      - name: Pack
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          name="wmpass-${TAG#cli-v}-$TARGET"
          mkdir "$name"
          cp LICENSE "$name/"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/wmpass.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "target/$TARGET/release/wmpass" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: WM Pass command line ${{ github.ref_name }}
          files: |
            wmpass-*.tar.gz
            wmpass-*.zip

  sums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" -R "$REPO"
          sha256sum * > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS -R "$REPO"
