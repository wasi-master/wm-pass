name: Android release

on:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: rustup target add aarch64-linux-android x86_64-linux-android armv7-linux-androideabi
      - run: cargo install cargo-ndk --locked
      - run: ./gradlew :app:assembleRelease :wear:assembleRelease
        working-directory: android
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" android/app/build/outputs/apk/release/*.apk android/wear/build/outputs/apk/release/*.apk --draft --title "WM Pass for Android $TAG"
