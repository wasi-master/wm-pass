name: Site release

# The site at wmpass.pages.dev: the docs, with the web vault under /vault/. The web vault's code is
# whatever this uploads, so it runs only for a release tag, from this repository's own workflow,
# and the `site` environment can be set to wait for an owner's approval.

on:
  push:
    tags: ['site-v*']

permissions:
  contents: read

jobs:
  deploy:
    # Playwright has no Chromium build for Ubuntu 26.04 yet, which ubuntu-latest now is.
    runs-on: ubuntu-24.04
    environment: site
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci
      - run: npm ci
        working-directory: docs
      # The cloud services' app ids go into the WebAssembly, which offers only the services it
      # has one for. The ids are repository variables; Google's and Box's secrets are secrets.
      # Google gets a client of its own for the web vault, apart from the extension's.
      - run: npm run site:build
        env:
          WMPASS_DRIVE_WEB_CLIENT_ID: ${{ vars.WMPASS_SITE_DRIVE_CLIENT_ID }}
          WMPASS_DRIVE_WEB_SECRET: ${{ secrets.WMPASS_SITE_DRIVE_SECRET }}
          WMPASS_DROPBOX_APP_KEY: ${{ vars.WMPASS_DROPBOX_APP_KEY }}
          WMPASS_ONEDRIVE_CLIENT_ID: ${{ vars.WMPASS_ONEDRIVE_CLIENT_ID }}
          WMPASS_BOX_CLIENT_ID: ${{ vars.WMPASS_BOX_CLIENT_ID }}
          WMPASS_BOX_CLIENT_SECRET: ${{ secrets.WMPASS_BOX_CLIENT_SECRET }}
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a node web/test/run.mjs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'wmpass' }} --branch=main
