# `cargo audit` reads Cargo.lock, which also lists optional dependencies that are
# never compiled. `cargo deny check` looks at the real build graph and is the gate.
# Both of these are listed only because `ssh-key`, `vsss-rs` or `keepass` can
# optionally use them. Confirm with `cargo tree -i rsa` before trusting this list.
[advisories]
ignore = [
    # rsa: only in wmpass-bw, because Bitwarden wraps organisation keys with RSA-OAEP. The
    # Marvin attack needs an attacker timing very many chosen decryptions, and a client
    # decrypts only its own organisation keys, once per sync, with no timing visible to anyone.
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0387", # crypto-bigint 0.5: not in the build graph; 0.7.10 is what builds.
]
