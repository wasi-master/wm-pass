[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/wasi-master/wm-pass"
rust-version = "1.99"
publish = false

[workspace.dependencies]
wmpass-core = { path = "crates/wmpass-core" }

argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
hkdf = "0.13"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
blake3 = { version = "1.8", default-features = false, features = ["std"] }
zeroize = { version = "1.9", features = ["derive"] }
subtle = "2.6"
getrandom = "0.4"
x25519-dalek = { version = "3", features = ["static_secrets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "warn"

# This disk is shared with big Gradle builds: no per-crate incremental state, and line
# tables rather than full debug info cut the target directory by about two thirds.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package.argon2]
opt-level = 3
[profile.test.package.argon2]
opt-level = 3
