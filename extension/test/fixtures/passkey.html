<!doctype html><title>Passkey fixture</title>
<button id="create">Create</button><button id="get">Sign in</button><button id="again">Create again</button><button id="abort">Sign in, then give up</button><pre id="out"></pre>
<script>
const b = (n) => crypto.getRandomValues(new Uint8Array(n));
let made = null, publicKey = null;
const raw = (der) => {
  // WebCrypto wants r and s side by side, each 32 bytes.
  let at = 2;
  const part = () => { at++; const n = der[at++]; let v = der.subarray(at, at + n); at += n; while (v.length > 32) v = v.subarray(1); const out = new Uint8Array(32); out.set(v, 32 - v.length); return out; };
  const r = part(), s = part();
  const out = new Uint8Array(64); out.set(r); out.set(s, 32); return out;
};
document.querySelector('#create').onclick = async () => {
  try {
    const c = await navigator.credentials.create({ publicKey: { challenge: b(32), rp: { name: 'Fixture' }, user: { id: b(16), name: 'sample@example.com', displayName: 'Sample' }, pubKeyCredParams: [{ type: 'public-key', alg: -7 }] } });
    made = c.rawId;
    publicKey = c.response.getPublicKey();
    const client = JSON.parse(new TextDecoder().decode(c.response.clientDataJSON));
    out.textContent = JSON.stringify({ created: true, type: client.type, origin: client.origin === location.origin, id: c.id.length });
  } catch (e) { out.textContent = JSON.stringify({ error: e.name }); }
};
document.querySelector('#get').onclick = async () => {
  try {
    const challenge = b(32);
    const c = await navigator.credentials.get({ publicKey: { challenge, allowCredentials: [{ type: 'public-key', id: made }] } });
    const client = new Uint8Array(c.response.clientDataJSON);
    const parsed = JSON.parse(new TextDecoder().decode(client));
    const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', client));
    const auth = new Uint8Array(c.response.authenticatorData);
    const signed = new Uint8Array(auth.length + 32); signed.set(auth); signed.set(hash, auth.length);
    const key = await crypto.subtle.importKey('spki', publicKey, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
    const good = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, raw(new Uint8Array(c.response.signature)), signed);
    const expected = btoa(String.fromCharCode(...challenge)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const rpHash = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(location.hostname)));
    out.textContent = JSON.stringify({ signed: good, challenge: parsed.challenge === expected, origin: parsed.origin === location.origin, rp: rpHash.every((v, i) => v === auth[i]), uv: (auth[32] & 4) !== 0 });
  } catch (e) { out.textContent = JSON.stringify({ error: e.name, message: e.message }); }
};
// A second passkey for an account the site already has one for, as excludeCredentials says.
document.querySelector('#again').onclick = async () => {
  try {
    await navigator.credentials.create({ publicKey: { challenge: b(32), rp: { name: 'Fixture' }, user: { id: b(16), name: 'sample@example.com', displayName: 'Sample' }, pubKeyCredParams: [{ type: 'public-key', alg: -7 }], excludeCredentials: [{ type: 'public-key', id: made }] } });
    out.textContent = JSON.stringify({ created: true });
  } catch (e) { out.textContent = JSON.stringify({ error: e.name }); }
};
// A site that gives up waiting, as when the person picks another way to sign in.
document.querySelector('#abort').onclick = async () => {
  const stop = new AbortController();
  setTimeout(() => stop.abort(), 1500);
  try {
    await navigator.credentials.get({ publicKey: { challenge: b(32), allowCredentials: [{ type: 'public-key', id: made }] }, signal: stop.signal });
    out.textContent = JSON.stringify({ signed: true });
  } catch (e) { out.textContent = JSON.stringify({ error: e.name }); }
};
</script>
