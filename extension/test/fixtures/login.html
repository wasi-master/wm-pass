<!doctype html><title>Login fixture</title>
<form id="f" action="/login.html" method="get" onsubmit="event.preventDefault(); location.href='/login.html?done=1'">
<label>Email <input id="user" name="email" type="email" autocomplete="username" style="width:280px;height:32px;margin:40px"></label>
<label>Password <input id="pass" name="password" type="password" style="width:280px;height:32px;margin:40px"></label>
<button id="go" style="margin:40px">Sign in</button></form>
<script>
// Signed in: the page after it shows no sign-in form, as a real site's would.
if (location.search.includes('done=1')) document.getElementById('f').replaceWith(Object.assign(document.createElement('p'), { textContent: 'Signed in.' }));
</script>
